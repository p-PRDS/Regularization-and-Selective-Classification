model:
  path: ${paths.models}/cifar/classifiers/${model.name}
  weights_name: ${model.name}_bestClassifier
  checkpoint: LastStep

data_seed: 42
valid_prop: 0.1
folds: [0, 1, 2, 3, 4]

metrics_dict:
  test: 
    Accuracy:
      _target_: regularization_and_sc.utils.metrics.accuracy
      _partial_: true 
    NLL:
      _target_: torch.nn.CrossEntropyLoss
    AURC:
      _target_: regularization_and_sc.utils.metrics.AURC_fromlogits
      _partial_: true
  val: 
    Accuracy:
      _target_: regularization_and_sc.utils.metrics.accuracy
      _partial_: true 
    NLL:
      _target_: torch.nn.CrossEntropyLoss
    AURC:
      _target_: regularization_and_sc.utils.metrics.AURC_fromlogits
      _partial_: true
  train:
    Accuracy:
      _target_: regularization_and_sc.utils.metrics.accuracy
      _partial_: true 
    NLL:
      _target_: torch.nn.CrossEntropyLoss
    AURC:
      _target_: regularization_and_sc.utils.metrics.AURC_fromlogits
      _partial_: true