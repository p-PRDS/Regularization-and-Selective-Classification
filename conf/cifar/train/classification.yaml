defaults:
  - loss: LabelSmoothing
  - optimizer: SGD
  - scheduler: MultiStepLR
  - seeds: default
  - wandb: classifiers
  - metrics: classifiers
  - _self_

fold: 0
batchsize: 128
valid_prop: 0.1
n_steps: 70400
n_steps_for_eval: 352
warmup_steps: 352

mixup: 1.0
cutmix: 1.0

wandb:
  group: ${model.netname}_LS_${train.loss.label_smoothing}_MU_${train.mixup}_CM_${train.cutmix}_WD_${train.optimizer.weight_decay}
  
name: ${model.netname}_LS_${train.loss.label_smoothing}_MU_${train.mixup}_CM_${train.cutmix}_WD_${train.optimizer.weight_decay}_fold_${train.fold}
saving_path: ${paths.models}/cifar/classifiers/${model.netname}