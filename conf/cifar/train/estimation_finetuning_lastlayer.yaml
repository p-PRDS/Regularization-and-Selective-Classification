defaults:
  - loss: CrossEntropy
  - optimizer: SGD
  - scheduler: MultiStepLR
  - seeds: default
  - wandb: estimators
  - metrics: estimators
  - _self_

batchsize: 128
valid_prop: 0.1
fold: 0
n_steps: 10560
n_steps_for_eval: 352
warmup_steps: 352

scheduler: 
  milestones: [3168, 6336, 9504]
  gamma: 0.2

mixup: 0.0
cutmix: 0.0

classifier: ${model.netname}_bestClassifier_fold_${train.fold}_LastStep

metrics:
  val: 
    FC-AURC:
      classifier_logits_path: ${paths.models}/cifar/classifiers/${model.netname}/logits/val/${train.classifier}.pt
  
  train:
    FC-AURC:
      classifier_logits_path: ${paths.models}/cifar/classifiers/${model.netname}/logits/train/${train.classifier}.pt

set_model:
  - _target_: torch.nn.Module.load_state_dict
    state_dict: 
      _target_: torch.load
      f: ${paths.models}/cifar/classifiers/${model.netname}/weights/${train.classifier}.pt
  - _target_: regularization_and_sc.fine_tuning.utils.freeze_model_but_lastlayer

name: ${model.netname}_FineTuningLastLayer
saving_path: ${paths.models}/cifar/estimators/finetuning/${model.netname}