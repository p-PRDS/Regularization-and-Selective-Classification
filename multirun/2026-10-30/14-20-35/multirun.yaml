hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - model.name=googlenet,resnet50,vgg16,squeezenet,shufflenetv2,densenet121
  job:
    name: eval
    chdir: null
    override_dirname: model.name=googlenet,resnet50,vgg16,squeezenet,shufflenetv2,densenet121
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.8
    version_base: '1.3'
    cwd: /home/pedro-pordeus/regularization_and_sc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/pedro-pordeus/regularization_and_sc/conf/cifar
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      eval: classification
      train: classification
      model: googlenet_classifier
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
model:
  name: googlenet
train:
  data_seed: 42
  model_seed: 42
  dataloader_seed: 42
  batchsize: 128
  valid_prop: 0.1
  folds: 5
  n_steps: 70400
  n_steps_for_eval: 352
  warmup_steps: 352
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    milestones:
    - 21120
    - 42240
    - 63360
    gamma: 0.2
  optimizer:
    _target_: torch.optim.SGD
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    label_smoothing: 0.1
  mixup: 1.0
  cutmix: 1.0
  metrics_dict:
    val:
      Accuracy:
        _target_: regularization_and_sc.utils.metrics.accuracy
        _partial_: true
      NLL:
        _target_: torch.nn.CrossEntropyLoss
  wandb:
    project: RegularizationInSC-Cifar-Classifiers
    group: ${model.name}_bestClassifier
    config:
      batchsize: ${train.batchsize}
      weight_decay: ${train.optimizer.weight_decay}
      label_smoothing: ${train.criterion.label_smoothing}
      mixup: ${train.mixup}
      cutmix: ${train.cutmix}
  saving_path: ${paths.models}/cifar/classifiers/${model.name}
eval:
  model:
    path: ${paths.models}/cifar/classifiers/${model.name}
    weights_name: ${model.name}_bestClassifier
    checkpoint: LastStep
  data_seed: 42
  valid_prop: 0.1
  folds:
  - 0
  - 1
  - 2
  - 3
  - 4
  metrics_dict:
    test:
      Accuracy:
        _target_: regularization_and_sc.utils.metrics.accuracy
        _partial_: true
      NLL:
        _target_: torch.nn.CrossEntropyLoss
      AURC:
        _target_: regularization_and_sc.utils.metrics.AURC_fromlogits
        _partial_: true
    val:
      Accuracy:
        _target_: regularization_and_sc.utils.metrics.accuracy
        _partial_: true
      NLL:
        _target_: torch.nn.CrossEntropyLoss
      AURC:
        _target_: regularization_and_sc.utils.metrics.AURC_fromlogits
        _partial_: true
    train:
      Accuracy:
        _target_: regularization_and_sc.utils.metrics.accuracy
        _partial_: true
      NLL:
        _target_: torch.nn.CrossEntropyLoss
      AURC:
        _target_: regularization_and_sc.utils.metrics.AURC_fromlogits
        _partial_: true
paths:
  project: /home/pedro-pordeus/regularization_and_sc
  models: ${paths.project}/models
