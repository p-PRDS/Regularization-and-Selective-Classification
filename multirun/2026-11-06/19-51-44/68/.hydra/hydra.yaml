hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      train.loss.label_smoothing: 0,0.1
      train.mixup: 0,1.0
      train.cutmix: 0,1.0
      train.optimizer.weight_decay: 0,5e-4
      train.fold: 0,1,2,3,4
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - train.loss.label_smoothing=0.1
    - train.mixup=1.0
    - train.cutmix=0
    - train.optimizer.weight_decay=0.0005
    - train.fold=3
    - +experiments=train_best_classifier_grid_search
  job:
    name: train
    chdir: null
    override_dirname: +experiments=train_best_classifier_grid_search,train.cutmix=0,train.fold=3,train.loss.label_smoothing=0.1,train.mixup=1.0,train.optimizer.weight_decay=0.0005
    id: '68'
    num: 68
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.8
    version_base: '1.3'
    cwd: /home/pedro-pordeus/regularization_and_sc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/pedro-pordeus/regularization_and_sc/conf/cifar
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/pedro-pordeus/regularization_and_sc/multirun/2026-11-06/19-51-44/68
    choices:
      experiments: train_best_classifier_grid_search
      eval: classification
      train: classification
      train/metrics: classifiers
      train/wandb: classifiers
      train/seeds: default
      train/scheduler: MultiStepLR
      train/optimizer: SGD
      train/loss: LabelSmoothing
      model: googlenet
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
