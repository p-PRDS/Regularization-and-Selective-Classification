[project]
name = "regularization-and-sc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p-PRDS", email = "pedropordeuss@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "hydra-core>=1.3.8",
    "ipykernel>=7.4.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "wandb>=0.31.0",
]

[project.scripts]
regularization-and-sc = "regularization_and_sc:main"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
